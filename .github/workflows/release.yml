name: Release

# Manual: run it from the Actions tab (or `gh workflow run release.yml`) when the
# version in VERSION is the one you want to publish.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (review before publishing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read the version
        shell: bash
        run: |
          version=$(tr -d ' \t\r\n' < VERSION)
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      - name: Refuse to overwrite an existing tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION (and linkGithub.Text) first."
            exit 1
          fi

      # VERSION drives the updater, linkGithub.Text is what the running app reports
      # to it. If they drift the app offers an update to itself, forever.
      - name: Check the version is consistent across the app
        shell: bash
        run: |
          label=$(grep -oP 'linkGithub\.Text = "\K[^"]+' FormMain.Designer.cs)
          if [ "$label" != "$VERSION" ]; then
            echo "::error::VERSION is $VERSION but FormMain.Designer.cs reports $label"
            exit 1
          fi
          echo "Version label matches: $label"

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish WebMCam.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      # BtbN's builds are hosted on GitHub itself, so no rate limits or CDN
      # surprises in CI, and the gpl variant carries the libvpx and libvorbis
      # encoders the default arguments use.
      #
      # Their "latest" tag holds both nightly master snapshots and builds of the
      # stable release branches. Pick the highest release branch rather than
      # master: a shipped binary should not ride master, and a version like
      # n9.0.1 is traceable in a bug report where N-126523 is not. Selecting it
      # dynamically means the next stable line is picked up on its own, instead
      # of this URL quietly pinning us to an old branch forever.
      - name: Bundle the latest stable FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" `
            -Headers @{ "User-Agent" = "webmcam-release"; "Authorization" = "Bearer $env:GH_TOKEN" }

          $pattern = '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-\d+\.\d+\.zip$'
          $builds = $release.assets |
            Where-Object { $_.name -match $pattern } |
            ForEach-Object {
              [void]($_.name -match $pattern)
              [pscustomobject]@{
                Name    = $_.name
                Url     = $_.browser_download_url
                Version = [version]("{0}.{1}" -f $Matches[1], $Matches[2])
              }
            } | Sort-Object Version -Descending

          if (-not $builds) { throw "no stable release-branch FFmpeg build in BtbN's latest tag" }

          $pick = $builds[0]
          Write-Host "Stable branches available: $(($builds.Version | ForEach-Object { $_.ToString() }) -join ', ')"
          Write-Host "Selected: $($pick.Name)"

          Invoke-WebRequest -Uri $pick.Url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp

          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in $env:FFMPEG_URL" }

          # Next to WebMCam.exe: that is where the app's default path resolves to.
          Copy-Item $exe.FullName publish/ffmpeg.exe

          $license = Get-ChildItem ffmpeg-tmp -Recurse -Include LICENSE, LICENSE.txt | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName publish/FFMPEG-LICENSE.txt }

          $banner = (& publish/ffmpeg.exe -version | Select-Object -First 1)
          if (-not $banner) { throw "the bundled ffmpeg.exe did not run" }
          if ($banner -notmatch 'ffmpeg version n\d') {
            throw "expected a stable FFmpeg build, got: $banner"
          }
          "FFMPEG_VERSION=$banner" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Bundled: $banner"

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

          # WebMCam.dll.config carries the settings schema; without it the app
          # cannot read or persist its options.
          foreach ($required in @("WebMCam.exe", "WebMCam.dll.config", "ffmpeg.exe")) {
            if (-not (Test-Path "publish/$required")) { throw "missing from the package: $required" }
          }

          $zip = "WebMCam-$env:TAG-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem publish | Select-Object Name, Length | Format-Table
          "{0:N1} MB zipped" -f ((Get-Item $zip).Length / 1MB)

      - name: Write the release notes
        shell: bash
        run: |
          cat > notes.md <<NOTES
          Self-contained Windows x64 build. **No .NET runtime to install** - unzip and
          run \`WebMCam.exe\`.

          FFmpeg is bundled next to the executable, so there is nothing to configure on
          first run:

          > $FFMPEG_VERSION

          **Full changelog:** https://github.com/${{ github.repository }}/commits/$TAG
          NOTES
          cat notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=()
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "WebMCam $VERSION" \
            --notes-file notes.md \
            "${args[@]}" \
            "$ZIP"

          echo "Released $TAG"
